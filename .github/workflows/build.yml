# Builds a postmarketOS image for the Lenovo TB-7304F with pmbootstrap
name: Build postmarketOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  DEVICE: lenovo-tb7304f
  PMAPORTS: /home/runner/.local/var/pmbootstrap/cache_git/pmaports

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the device packages
        uses: actions/checkout@v4

      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kpartx android-sdk-libsparse-utils zip cpio xz-utils e2fsprogs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          mkdir -p ~/.local/bin
          ln -s ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up pmbootstrap
        run: |
          set +o pipefail
          yes "" | pmbootstrap --details-to-stdout init
          set -o pipefail
          test -d "$PMAPORTS/device/testing"
          cp -r "device-$DEVICE" "linux-$DEVICE" "$PMAPORTS/device/testing/"
          pmbootstrap config device "$DEVICE"
          pmbootstrap config ui none
          pmbootstrap config service_manager openrc
          pmbootstrap config hostname tb7304f
          pmbootstrap --details-to-stdout checksum "device-$DEVICE" "linux-$DEVICE"
          pmbootstrap config

      - name: Build the image
        run: |
          pmbootstrap --details-to-stdout install --password 147147

      - name: Collect the output
        run: |
          pmbootstrap --details-to-stdout export "$RUNNER_TEMP/export"
          ls -lL "$RUNNER_TEMP/export"
          mkdir dist zip work
          simg2img "$RUNNER_TEMP/export/$DEVICE.img" work/disk.img

          # The image holds a boot and a root partition. Only the root
          # filesystem is used: it goes to userdata as it is, and the boot
          # image is put together below.
          loop=$(sudo losetup -Pf --show work/disk.img)
          sudo blkid "${loop}p1" "${loop}p2"
          sudo mkdir -p /mnt/root
          sudo mount "${loop}p2" /mnt/root

          # The initramfs mounts the root filesystem, and there is no udev to
          # wait for and no virtual terminal to log in on
          echo "# The root filesystem is mounted by the initramfs" | sudo tee /mnt/root/etc/fstab
          sudo find /mnt/root/etc/runlevels -name 'udev*' -print -delete
          sudo sed -i 's/^tty[0-9]/#&/' /mnt/root/etc/inittab
          sudo find /mnt/root/etc/runlevels | sort
          for f in etc/init.d/tb7304f-x usr/bin/Xorg usr/bin/startxfce4 usr/sbin/msm-fb-refresher \
                   usr/lib/xorg/modules/drivers/fbdev_drv.so usr/lib/xorg/modules/input/evdev_drv.so; do
            sudo test -e "/mnt/root/$f" || { echo "$f is missing from the root filesystem"; exit 1; }
          done

          # busybox and its C library for the initramfs
          mkdir -p work/initramfs/bin work/initramfs/lib work/initramfs/proc work/initramfs/sys work/initramfs/dev
          sudo cp /mnt/root/bin/busybox work/initramfs/bin/busybox
          sudo cp -L /mnt/root/lib/ld-musl-aarch64.so.1 work/initramfs/lib/ld-musl-aarch64.so.1
          sudo chown -R "$USER" work/initramfs
          install -m 755 initramfs/init work/initramfs/init
          sudo umount /mnt/root

          sudo e2fsck -fy "${loop}p2" || [ $? -le 1 ]
          sudo resize2fs -M "${loop}p2"
          blocks=$(sudo dumpe2fs -h "${loop}p2" 2>/dev/null | awk '/^Block count:/ { print $3 }')
          bsize=$(sudo dumpe2fs -h "${loop}p2" 2>/dev/null | awk '/^Block size:/ { print $3 }')
          sudo dd if="${loop}p2" of=zip/rootfs.img bs="$bsize" count="$blocks" status=none
          sudo chown "$USER" zip/rootfs.img
          sudo losetup -d "$loop"
          rm work/disk.img
          echo "rootfs.img: $((blocks * bsize)) bytes"
          [ $((blocks * bsize)) -le 3323625472 ] || { echo "rootfs.img does not fit userdata"; exit 1; }

          (cd work/initramfs && find . | sort | cpio -o -H newc -R 0:0) | xz --format=lzma -9 > work/initramfs.cpio.lzma
          python3 tools/mkbootimg.py "linux-$DEVICE/kernel" work/initramfs.cpio.lzma work/boot-plain.img \
            "bootopt=64S3,32N2,64N2"
          # The bootloader only accepts kernels and ramdisks with MediaTek headers
          python3 tools/mtk_header.py work/boot-plain.img dist/boot.img ROOTFS
          size=$(stat -c %s dist/boot.img)
          echo "boot.img: $size / 16777216 bytes"
          [ "$size" -le 16777216 ] || { echo "boot.img does not fit the boot partition"; exit 1; }

          # TWRP flashable zip: the root filesystem for userdata and boot.img
          cp -r installer/META-INF zip/
          cp dist/boot.img zip/boot.img
          for f in boot rootfs; do
            bytes=$(stat -c %s "zip/$f.img")
            [ $((bytes % 2048)) = 0 ] || { echo "$f.img size is not a multiple of 2048"; exit 1; }
            name=$(echo "$f" | tr a-z A-Z)
            echo "${name}_BYTES=$bytes" >> zip/installer.conf
            echo "${name}_SHA256=$(sha256sum "zip/$f.img" | cut -d ' ' -f 1)" >> zip/installer.conf
          done
          cat zip/installer.conf
          (cd zip && zip -r -6 "../dist/postmarketos-$DEVICE-twrp.zip" META-INF installer.conf boot.img rootfs.img)
          (cd dist && sha256sum * | tee sha256sums.txt)

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-lenovo-tb7304f
          path: dist/*
